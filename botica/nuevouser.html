<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Usuario - Botica Phatma</title>

    <link rel="stylesheet" href="estilo.css"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        img {
            height: 500px;
        }

        .contenedor {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedorlogin {
            margin-left: 50px;
        }

        form {
            width: 350px;
            background: #e3f2fd;
            padding: 20px;
            border-radius: 15px;
        }

        h1 {
            color: #0d6efd;
        }
    </style>
</head>

<body>

<!-- LOGO -->
<div class="contenedor">
    <img src="imagenes/logo.png" class="imagenlogo">
</div>

<div class="contenedor">

    <!-- IMAGEN -->
    <div class="contenedorimagen">
        <img src="imagenes/login.png" alt="">
    </div>

    <!-- FORMULARIO -->
    <div class="contenedorlogin">

        <form method="post">

            <h1>Registro - Botica Phatma</h1>

            <label>Usuario</label>
            <input type="text" name="usuario" class="form-control mb-2" required>

            <label>Contraseña</label>
            <input type="password" name="clave1" class="form-control mb-2" required>

            <label>Confirmar contraseña</label>
            <input type="password" name="clave2" class="form-control mb-2" required>

            <button type="submit" name="enviar" class="btn btn-primary w-100">
                Registrar
            </button>

            <br><br>
            <a href="login.html">Ir al Login</a>

        </form>

    </div>

</div>

</body>
</html>
