<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display:flex; justify-content:center; align-items:center; height:100vh; font-family: 'Inter', sans-serif;">

<div class="card p-5" style="width:100%; max-width:400px; border-radius:20px; border:none; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
    
    <h3 class="text-center mb-4" style="color: #667eea; font-weight:700; font-size:1.8rem;">Crear Cuenta</h3>

    <form method="post">
        <input type="text" name="user" class="form-control mb-3" placeholder="👤 Usuario" required style="border-radius:12px; border:2px solid #eee; padding:12px 15px; font-size:0.95rem;">
        <input type="password" name="clave" class="form-control mb-4" placeholder="🔒 Contraseña" required style="border-radius:12px; border:2px solid #eee; padding:12px 15px; font-size:0.95rem;">

        <button type="submit" name="registrar" class="btn w-100" style="background: linear-gradient(135deg, #4CAF50, #2e7d32); color:white; padding:12px; border-radius:12px; border:none; font-weight:600; transition:all 0.3s ease;" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 25px rgba(76,175,80,0.3)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='';">
            Registrarse
        </button>
    </form>

    <div class="text-center mt-4">
        <p style="color:#666;">¿Ya tienes cuenta? <a href="login.html" style="color:#667eea; font-weight:600; text-decoration:none;">Inicia sesión</a></p>
    </div>

</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
